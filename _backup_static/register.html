	<div class="lines">

        <img src="images/ban-shape-7.png" class="shape-5" />
      <div class="signup-card clearfix">
        <h1>Create Your Account</h1>
        <p>Start creating smarter invoices in seconds.</p>

        <form action="" method="POST" autocomplete="off" class="contactform">
          <div class="row">
            <div class="form-group col-md-6">
              <input type="text" class="form-control" id="BusinessNameID " name=" Business Name" required="">
              <label> Business Name  <span class="asterisk">*</span></label>
            </div>
            <div class="form-group col-md-6">
              <input type="text" class="form-control" name="Business Code" id="BusinessCodeID" required="">
              <label> Business Code <span class="asterisk">*</span> </label>
            </div>
            <div class="form-group col-md-6">
              <input type="text" class="form-control" name="SubDomainName" id="SubDomainID" required="">
              <label> Sub Domain Name <span class="asterisk">*</span> </label>
            </div>
              <div class="form-group col-md-6">
              <input type="email" class="form-control email" name="email" id="BusinessEmailID" required="">
              <label>Business Email <span class="asterisk">*</span> </label>
            </div>
            <div class="form-group col-md-6">
              <input type="text" class="form-control" name="Country" id="CountryID" required="">
              <label> Country <span class="asterisk">*</span></label>
            </div>
            <div class="form-group col-md-6">
              <input type="text" class="form-control" name="Business Address" id="BusinessAddressID" required="">
              <label> Business Address <span class="asterisk">*</span></label>
            </div>
            <div class="form-group col-md-4">
              <input type="text" class="form-control" name="City" id="CityID" required="">
              <label> City <span class="asterisk">*</span></label>
            </div>
            <div class="form-group col-md-4">
              <input type="text" class="form-control" name="State" id="StateID" required="">
              <label> State <span class="asterisk">*</span></label>
            </div>
            <div class="form-group col-md-4">
              <input type="text" class="form-control" name="Postal Code " id="Postal Code ID" required="">
              <label> Postal Code  <span class="asterisk">*</span></label>
            </div>
            <button type="submit" value="Submit" class="submit btn-animate btn">Submit</button>
          </div>
        </form>

        <!--<div class="bottom">
